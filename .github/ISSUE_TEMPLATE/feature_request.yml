name: Feature request
description: Suggest a new tool or an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This server wraps the erp2pdf.com Template API, so a tool can only do
        what the API offers. Describe what you want the agent to be able to
        do; we will check whether the API supports it.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The tool, parameter or behaviour you would like, and an example prompt or call.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or other approaches.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to open a pull request for this.
