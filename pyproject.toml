[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "erp2pdf-studio-mcp"
version = "0.4.1"
description = "MCP server for the erp2pdf.com Template API: build and test PDF templates from an AI agent."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "erp2pdf.com", email = "hello@erp2pdf.com" }]
maintainers = [{ name = "erp2pdf.com", email = "hello@erp2pdf.com" }]
keywords = [
  "mcp",
  "model-context-protocol",
  "erp2pdf",
  "odoo",
  "pdf",
  "pdf-templates",
  "email-templates",
  "ai-agent",
  "claude",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: AsyncIO",
  "Topic :: Office/Business",
  "Topic :: Printing",
]
dependencies = [
  "mcp==2.3.0",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]
dev = ["ruff>=0.7", "build>=1.2"]

[project.scripts]
erp2pdf-studio-mcp = "erp2pdf_studio.server:main"

[project.urls]
Homepage = "https://erp2pdf.com"
Documentation = "https://erp2pdf.com/api-docs#template-api"
Source = "https://github.com/c4pointer/erp2pdf-studio-mcp"
Issues = "https://github.com/c4pointer/erp2pdf-studio-mcp/issues"
Changelog = "https://github.com/c4pointer/erp2pdf-studio-mcp/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["erp2pdf_studio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["erp2pdf_studio"]
